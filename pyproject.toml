[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoli-3d"
version = "0.1.0"
description = "3D structural model of an E. coli cell — packs a v2ecoli molecular state into a 3D cell via viva-parsimony"
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    # the molecular state + cell-envelope geometry (ShapeStep) come from v2ecoli;
    # the packing engine (Ingredient/Chromosome/build_pack) from viva-parsimony.
    "v2ecoli",
    "viva-parsimony",
    "viva-workspace",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = { find = { where = ["."], include = ["ecoli_3d*"] } }

[tool.setuptools.package-data]
# ship the committed cell-state snapshots + reference tables + webapp + publish scripts
"ecoli_3d" = ["data/*.npz", "data/*.csv", "data/*.json", "webapp/*", "publish/*"]

[tool.uv.sources]
# uv sources are NOT transitive: because we depend on v2ecoli (which resolves its
# own deps from git, not PyPI), a from-scratch resolve here must declare the same
# git sources so the transitive pbg/vivarium packages resolve to consistent URLs.
# Mirrors v2ecoli's [tool.uv.sources] + viva-basic-processes (pulled in via
# vivarium-workbench). Keep in sync with v2ecoli's pyproject.
v2ecoli = { git = "https://github.com/vivarium-collective/v2ecoli.git", branch = "main" }
viva-workspace = { git = "https://github.com/vivarium-collective/viva-workspace.git", branch = "main" }
process-bigraph = { git = "https://github.com/vivarium-collective/process-bigraph.git", branch = "main" }
bigraph-schema = { git = "https://github.com/vivarium-collective/bigraph-schema.git", branch = "main" }
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
viva-copasi = { git = "https://github.com/vivarium-collective/viva-copasi.git", branch = "main" }
viva-parsimony = { git = "https://github.com/vivarium-collective/viva-parsimony.git", branch = "main" }
viva-bioreactordesign = { git = "https://github.com/vivarium-collective/viva-bioreactordesign.git", branch = "main" }
viva-ketchup = { git = "https://github.com/vivarium-collective/viva-ketchup.git", branch = "main" }
viva-emitters = { git = "https://github.com/vivarium-collective/viva-emitters.git", branch = "main" }
viva-torch = { git = "https://github.com/vivarium-collective/viva-torch.git", branch = "main" }
viva-basic-processes = { git = "https://github.com/vivarium-collective/viva-basic-processes.git", branch = "main" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
viva-munk = { git = "https://github.com/vivarium-collective/Viva-munk.git", branch = "main" }
spatio-flux = { git = "https://github.com/vivarium-collective/spatio-flux.git", branch = "main" }
ecoli-sources = { git = "https://github.com/vivarium-collective/ecoli-sources.git", rev = "e0fcfab181de59666b9f8ad2d1cb80ffe5c2a314" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: unit / state-reader tests (no simulation)",
    "slow: full simulation builds (minutes)",
    "sim: calls composite.run()",
]

[tool.uv]
# viva-basic-processes is pulled in transitively (viva-superpowers, vivarium-workbench)
# via branch-pinned git URLs that uv won't unify ("conflicting URLs"). Force a
# single precise (commit-pinned) requirement so the whole closure resolves.
override-dependencies = [
    "viva-basic-processes @ git+https://github.com/vivarium-collective/viva-basic-processes.git@3f7d64ee06337c8887d8db6d47b0bdfc6dea0093",
]
